[General]
keyboard_layout=en_US

[cameras]
upperLeftCamera\associated_focal_id=leftCameraFocal
upperLeftCamera\associated_light_id=leftCameraLightingLed
upperLeftCamera\default_exposure_us=10000
upperLeftCamera\default_framerate=30
upperLeftCamera\default_gain_db=0
upperLeftCamera\max_exposure_us=50000
upperLeftCamera\max_gain_db=24
upperLeftCamera\serial_number=DUMMY
upperRightCamera\associated_focal_id=rightCameraFocal
upperRightCamera\associated_light_id=rightCameraLightingLed
upperRightCamera\default_exposure_us=10000
upperRightCamera\default_framerate=30
upperRightCamera\default_gain_db=0
upperRightCamera\max_exposure_us=50000
upperRightCamera\max_gain_db=24
upperRightCamera\serial_number=DUMMY

[forceSensors]
backForceSensorADC\adc_to_gram_force_factor=1
leftForceSensorADC\adc_to_gram_force_factor=1
rightForceSensorADC\adc_to_gram_force_factor=1

[mcus]
mcu1_baudrate=115200
mcu1_port=/dev/arduino1
mcu2_baudrate=115200
mcu2_port=/dev/arduino2
mcu3_baudrate=115200
mcu3_port=/dev/ttyACM0
mcu4_baudrate=115200
mcu4_port=/dev/arduino4

