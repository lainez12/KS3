name: Compile Kub3Project

on:
  push:
    branches:
      - dev
      - ci-setup

jobs:
  build:
    name: Build ${{ matrix.preset }}
    runs-on: ubuntu-latest

    # The matrix allows you to run the same job multiple times with different variables.
    strategy:
      fail-fast: false # If one build fails, let the others continue
      matrix:
        preset: 
          - kub3-8-release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Copies the CI preset to the root so CMake can find it
      - name: Setup CI CMake Presets
        run: cp .gitea/ci-presets.json CMakePresets.json

      # Installs Qt6, CMake, and build tools in the runner container
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build \
            python3-pip python3-venv libcrypt-dev \
            libgl1-mesa-dev libvulkan-dev libxkbcommon-dev libfontconfig1-dev

      - name: Install Qt 6.8 (via aqtinstall)
        run: |
          python3 -m venv aqt-env
          source aqt-env/bin/activate
          pip install aqtinstall
          echo "Downloading Qt 6.8.3..."
          aqt install-qt linux desktop 6.8.3 linux_gcc_64 -m qtserialport --outputdir $PWD/Qt
          aqt list-qt linux desktop --modules 6.8.3 linux_gcc_64
          ls -la $PWD/Qt

      - name: Configure CMake
        # - Tell CMake exactly where to find the Qt 6.8 we just downloaded
        # - Run the preset
        run: |
          export Qt6_DIR=$PWD/Qt/6.8.3/linux_gcc_64/lib/cmake/Qt6
          cmake --preset ${{ matrix.preset }}

      - name: Build Project
        run: |
          MAX_CORES=$(nproc)
          JOBS=$(( MAX_CORES / 2 ))
          if [ $JOBS -lt 1 ]; then JOBS=1; fi
          echo "Total CPU cores: $MAX_CORES. Building with $JOBS cores."
          cmake --build --preset ${{ matrix.preset }} -j 14

      # (Optional) Install step to gather binaries cleanly in one folder (see deploy.sh script)

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Binaries-${{ matrix.preset }}
          # IMPORTANT: Update this path to match the "binaryDir" defined in your CMakePresets.json!
          # For example, if your preset outputs to "build/kub3-8-release", adjust this accordingly:
          path: build/${{ matrix.preset }}/bin/